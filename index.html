<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kaninologi – viden om kaniner</title>

  <meta name="description" content="Kaninologi formidler faglig og evidensbaseret viden om kaniners adfærd, sundhed, ernæring og velfærd.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .top {
      background: #ffffff;
      text-align: center;
      padding: 28px 20px 24px;
    }

    .logo {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .logo a {
      color: #222222;
      text-decoration: none;
    }

    .menu-bar {
      background: #536557;
      position: relative;
      z-index: 100;
    }

    .menu {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .menu-item {
      position: relative;
    }

    .menu-link,
    .menu-button {
      height: 54px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .menu-link:hover,
    .menu-button:hover,
    .menu-button.active {
      background: rgba(255,255,255,0.12);
    }

    .arrow {
      margin-left: 8px;
      font-size: 10px;
    }

    .dropdown {
      position: absolute;
      top: 54px;
      left: 0;
      min-width: 210px;
      background: white;
      border: 1px solid #e3e3e3;
      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
      display: none;
    }

    .dropdown.open {
      display: block;
    }

    .dropdown a {
      display: block;
      padding: 13px 16px;
      color: #222222;
      text-decoration: none;
      font-size: 14px;
      border-bottom: 1px solid #eeeeee;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: #f5f6f4;
    }

    .mobile-menu-button {
      display: none;
      width: 100%;
      height: 52px;
      border: none;
      background: #536557;
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .hero {
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 24px 100px;
      text-align: center;
      background: #ffffff;
    }

    .hero-content {
      max-width: 850px;
      width: 100%;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(60px, 12vw, 115px);
      line-height: 0.95;
      letter-spacing: -4px;
      font-weight: 700;
    }

    .tagline {
      max-width: 700px;
      margin: 28px auto 0;
      font-size: 20px;
      line-height: 1.6;
      color: #555555;
    }

    .illustration {
      width: 100%;
      max-width: 700px;
      min-height: 250px;
      margin: 50px auto 0;
    }

    footer {
      border-top: 1px solid #eeeeee;
      padding: 30px 20px;
      text-align: center;
      font-size: 13px;
      color: #777777;
      background: #ffffff;
    }

    @media (max-width: 850px) {
      .top {
        padding: 22px 20px;
      }

      .logo {
        font-size: 27px;
      }

      .mobile-menu-button {
        display: block;
      }

      .menu {
        display: none;
        flex-direction: column;
        align-items: stretch;
      }

      .menu.mobile-open {
        display: flex;
      }

      .menu-item {
        width: 100%;
      }

      .menu-link,
      .menu-button {
        width: 100%;
        height: 48px;
        justify-content: space-between;
        padding: 0 20px;
        border-top: 1px solid rgba(255,255,255,0.10);
      }

      .dropdown {
        position: static;
        width: 100%;
        border: none;
        box-shadow: none;
        background: #f5f6f4;
      }

      .dropdown a {
        padding-left: 35px;
      }

      .hero {
        min-height: 520px;
        padding-top: 65px;
      }

      .hero h1 {
        font-size: clamp(55px, 18vw, 85px);
        letter-spacing: -3px;
      }

      .tagline {
        font-size: 18px;
      }

      .illustration {
        min-height: 180px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="top">
    <p class="logo">
      <a href="index.html">KANINOLOGI</a>
    </p>
  </div>

  <div class="menu-bar">

    <button class="mobile-menu-button" id="mobileMenu">
      Menu ☰
    </button>

    <nav class="menu" id="mainMenu">

      <div class="menu-item">
        <a class="menu-link" href="index.html">
          Forside
        </a>
      </div>

      <div class="menu-item">
        <button class="menu-button">
          Viden
          <span class="arrow">▼</span>
        </button>

        <div class="dropdown">
        </div>
      </div>

      <div class="menu-item">
        <button class="menu-button">
          Sundhed
          <span class="arrow">▼</span>
        </button>

        <div class="dropdown">
          <a href="#">
            Smerter hos kaniner
          </a>

          <a href="#">
            Hø
          </a>
        </div>
      </div>

      <div class="menu-item">
        <button class="menu-button">
          Adfærd
          <span class="arrow">▼</span>
        </button>

        <div class="dropdown">
        </div>
      </div>

      <div class="menu-item">
        <button class="menu-button">
          Planter
          <span class="arrow">▼</span>
        </button>

        <div class="dropdown">
          <a href="#">
            Planteportrætter
          </a>
        </div>
      </div>

      <div class="menu-item">
        <button class="menu-button">
          Praktisk
          <span class="arrow">▼</span>
        </button>

        <div class="dropdown">
          <a href="#">
            Den gode base
          </a>

          <a href="#">
            Vinterflytning
          </a>
        </div>
      </div>

      <div class="menu-item">
        <a class="menu-link" href="#">
          Om Kaninologi
        </a>
      </div>

    </nav>
  </div>

</header>

<main>

  <section class="hero">

    <div class="hero-content">

      <h1>Kaninologi</h1>

      <p class="tagline">
        Faglig og evidensbaseret viden om kaniners adfærd,
        sundhed, ernæring og velfærd.
      </p>

      <div class="illustration">
      </div>

    </div>

  </section>

</main>

<footer>
  © 2026 Kaninologi · Viden om kaniner
</footer>

<script>

  const mobileMenu = document.getElementById("mobileMenu");
  const mainMenu = document.getElementById("mainMenu");
  const menuButtons = document.querySelectorAll(".menu-button");

  mobileMenu.addEventListener("click", function() {
    mainMenu.classList.toggle("mobile-open");
  });

  menuButtons.forEach(function(button) {

    button.addEventListener("click", function(event) {

      event.stopPropagation();

      const dropdown = button.nextElementSibling;

      menuButtons.forEach(function(otherButton) {

        if (otherButton !== button) {
          otherButton.classList.remove("active");

          const otherDropdown = otherButton.nextElementSibling;

          if (otherDropdown) {
            otherDropdown.classList.remove("open");
          }
        }

      });

      button.classList.toggle("active");

      if (dropdown) {
        dropdown.classList.toggle("open");
      }

    });

  });

  document.addEventListener("click", function() {

    menuButtons.forEach(function(button) {

      button.classList.remove("active");

      const dropdown = button.nextElementSibling;

      if (dropdown) {
        dropdown.classList.remove("open");
      }

    });

  });

</script>

</body>
</html>
