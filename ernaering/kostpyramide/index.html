<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ernæring | Kaninologi</title>

  <meta name="description"
        content="Viden om kaninens ernæring, kost, hø, græs, foder og grønt.">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .top {
      background: #ffffff;
      text-align: center;
      padding: 16px 20px 14px;
    }

    .logo {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .logo a {
      color: #222222;
      text-decoration: none;
    }

    .menu-bar {
      background: #536557;
    }

    .menu {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .menu a {
      min-height: 54px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background .2s ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,.12);
    }

    .mobile-menu-button {
      display: none;
      width: 100%;
      height: 52px;
      border: none;
      background: #536557;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .page {
      max-width: 1050px;
      margin: 0 auto;
      padding: 70px 25px 100px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 55px;
    }

    .page-header h1 {
      margin: 0 0 14px;
      font-size: 40px;
      line-height: 1.2;
    }

    .page-header p {
      max-width: 700px;
      margin: 0 auto;
      color: #666666;
      font-size: 17px;
      line-height: 1.7;
    }

    .article-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .article-card {
      min-height: 170px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: #e5ebe5;
      border: 1px solid #cdd7ce;
      text-decoration: none;
      color: #263029;
      transition: transform .2s ease, background .2s ease;
    }

    .article-card:hover {
      transform: translateY(-3px);
      background: #dbe4dc;
    }

    .article-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
    }

    .article-card p {
      margin: 0;
      color: #536057;
      font-size: 15px;
      line-height: 1.6;
    }

    footer {
      border-top: 1px solid #eeeeee;
      padding: 30px 20px;
      text-align: center;
      font-size: 13px;
      color: #777777;
      background: #ffffff;
    }

    @media (max-width: 850px) {
      .top {
        padding: 14px 18px 12px;
      }

      .logo {
        font-size: 27px;
      }

      .mobile-menu-button {
        display: block;
      }

      .menu {
        display: none;
        flex-direction: column;
        align-items: stretch;
      }

      .menu.mobile-open {
        display: flex;
      }

      .menu a {
        width: 100%;
        min-height: 48px;
        justify-content: flex-start;
        padding: 0 22px;
        border-top: 1px solid rgba(255,255,255,.10);
      }

      .page {
        padding: 50px 20px 70px;
      }

      .page-header h1 {
        font-size: 34px;
      }

      .page-header p {
        font-size: 16px;
      }

      .article-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="top">
    <p class="logo">
      <a href="../">KANINOLOGI</a>
    </p>
  </div>

  <div class="menu-bar">

    <button class="mobile-menu-button" id="mobileMenu" aria-label="Åbn menu">
      Menu ☰
    </button>

    <nav class="menu" id="mainMenu">
      <a href="../">Forside</a>
      <a href="../sundhed/">Sundhed</a>
      <a href="../ernaering/" class="active">Ernæring</a>
      <a href="../adfaerd/">Adfærd</a>
      <a href="../planter/">Planter</a>
      <a href="../kaninhold/">Kaninhold</a>
      <a href="../om/">Om Kaninologi</a>
    </nav>

  </div>

</header>

<main class="page">

  <div class="page-header">
    <h1>Ernæring</h1>
    <p>
      Viden om kaninens kost, fodring og de forskellige dele af en varieret kaninkost.
    </p>
  </div>

  <div class="article-grid">

    <a href="kostpyramide/" class="article-card">
      <h2>Kostpyramide</h2>
      <p>Se, hvordan du kan sammensætte en sund og varieret kost til din kanin.</p>
    </a>

  </div>

</main>

<footer>
  © 2026 Kaninologi · Viden om kaniner
</footer>

<script>
  const mobileMenu = document.getElementById("mobileMenu");
  const mainMenu = document.getElementById("mainMenu");

  mobileMenu.addEventListener("click", function() {
    mainMenu.classList.toggle("mobile-open");
  });
</script>

</body>
</html>
